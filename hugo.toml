baseURL = 'https://kubevirtbmc.io/'
locale = 'en-us'
title = 'KubeVirtBMC'

enableRobotsTXT = true
disableKinds = ['RSS', 'taxonomy', 'term', 'section', 'sitemap']

[params]
  description = 'KubeVirtBMC gives every KubeVirt virtual machine its own IPMI and Redfish endpoint, so bare-metal provisioning tools can manage it like a physical server.'

# hugo.Data and site.Language.Locale need Hugo 0.158.0 or later. CI builds
# with the version pinned in .github/workflows; use the same one locally for
# byte-identical output.
[module.hugoVersion]
  min = '0.158.0'
